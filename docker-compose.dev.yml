name: jts-structure

services:
  db:
    ports:
    - "5433:5432"
    image: postgres:15
    container_name: jts_postgres_db
    restart: always
    environment:
      POSTGRES_USER: cesaire
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: jts_structure
    volumes:
      - jts_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  backend:
    build: ./ets-backend
    container_name: jts_backend
    restart: always
    env_file:
      - ./ets-backend/.env
    environment:
      NODE_ENV: docker
      PORT: 3001
      DATABASE_URL: postgresql://cesaire:changeme@db:5432/jts_structure
    depends_on:
      - db
    networks:
      - app_network
    command: >
      sh -c "
        until nc -z db 5432;
        do
          echo 'Waiting for database...';
          sleep 2;
        done &&
        echo 'Running migrations...' &&
        npx prisma migrate deploy &&
        echo 'Starting app...' &&
        node dist/src/main.js
      "

  frontend:
    build:
      context: ./est-frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081/api
    container_name: jts_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: jts_nginx
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

volumes:
  jts_postgres_data:

networks:
  app_network:
