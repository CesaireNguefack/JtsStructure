name: jts-structure

services:
  frontend:
    image: ghcr.io/cesairenguefack/jts-frontend:latest
    container_name: jts_frontend
    restart: always
    ports:
      - "3010:3000"
    environment:
      # PRODUCTION: API exposee par Apache via le nom de domaine.
      # ANCIEN PROVISOIRE: NEXT_PUBLIC_API_URL: http://51.75.65.254:3011
      NEXT_PUBLIC_API_URL: https://jts-structure.com/api
    depends_on:
      - backend

  backend:
    image: ghcr.io/cesairenguefack/jts-backend:latest
    container_name: jts_backend
    restart: always
    env_file:
      - ./jts-backend/.env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://cesaire:changeme@db:5432/jts_structure
    ports:
      - "3011:3001"
    command: >
      sh -c "
        until nc -z db 5432;
        do
          echo 'Waiting for database...';
          sleep 2;
        done &&
        echo 'Running migrations...' &&
        npx prisma migrate deploy &&
        echo 'Starting app...' &&
        node dist/src/main.js
      "
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: jts_postgres_db
    restart: always
    environment:
      POSTGRES_USER: cesaire
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: jts_structure
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
